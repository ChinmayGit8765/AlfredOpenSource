name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[dev,mcp]" --system
      - name: Test (fully offline)
        run: python -m pytest -q
      - name: Offline smoke
        run: python -m alfred.runtime.cli demo-roundtrip --fake
